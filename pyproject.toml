[project]
name = "applenotes-mcp"
version = "0.1.0"
description = "Apple Notes MCP server with real rich-text formatting via Shortcuts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Gray" }]
keywords = ["apple-notes", "mcp", "shortcuts", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mcp[cli]>=1.28.1",
]

[project.scripts]
applenotes-mcp = "applenotes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tier 1 (pure functions) and tier 2 (golden protobuf fixtures) need neither Notes.app nor
# the NoteStore database, so a bare `pytest` is hermetic and safe. Anything that touches the
# real, iCloud-synced library must be marked `live` and is deselected by default.
addopts = "-m 'not live'"
markers = [
    "live: touches the real Notes library (creates/deletes notes). Opt in with -m live.",
]
